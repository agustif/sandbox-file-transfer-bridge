name: Build transfer artifact

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: transfer-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  transfer:
    name: Package approved transfer request
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event.label.name == 'approved-transfer'

    steps:
      - name: Verify labeler has elevated repo permission
        id: authz
        uses: actions/github-script@v7
        with:
          script: |
            const labeler = context.payload.sender.login;
            const issue = context.payload.issue;
            core.info(`Labeler: ${labeler}`);
            core.info(`Issue #${issue.number} by ${issue.user.login}`);

            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: labeler,
            });
            const level = perm.permission;
            core.info(`Permission level: ${level}`);
            const allowed = new Set(['admin', 'maintain', 'write']);
            if (!allowed.has(level)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: [
                  '❌ **Transfer build refused**',
                  '',
                  `Label \`approved-transfer\` was applied by \`${labeler}\` (permission: \`${level}\`).`,
                  'Only collaborators with **write**, **maintain**, or **admin** may approve transfers.',
                  '',
                  `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                ].join('\n'),
              });
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  name: 'approved-transfer',
                });
              } catch (e) {
                core.warning(`Could not remove label: ${e}`);
              }
              core.setFailed(`Refusing approval from ${labeler} with permission ${level}`);
              return;
            }
            core.setOutput('labeler', labeler);
            core.setOutput('permission', level);

      - name: Checkout trusted default branch only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Write issue body to file (data only)
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          body = os.environ.get("ISSUE_BODY") or ""
          Path("issue-body.txt").write_text(body, encoding="utf-8")
          print(f"wrote issue-body.txt ({len(body)} bytes)")
          PY

      - name: Parse and validate transfer request
        id: parse
        run: |
          set -euo pipefail
          chmod +x scripts/parse-request.py scripts/fetch-and-package.sh scripts/verify-transfer.sh
          python3 scripts/parse-request.py \
            issue-body.txt \
            --out-request work/request.json
          TYPE=$(python3 -c 'import json; print(json.load(open("work/request.json"))["type"])')
          REQ_SHA=$(python3 -c 'import json; print(json.load(open("work/request.json"))["request_sha256"])')
          NAME=$(python3 -c 'import json; print(json.load(open("work/request.json"))["name"])')
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "request_sha=$REQ_SHA" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          cat work/request.json

      - name: Fetch and package (inert bytes only)
        id: pack
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/transfer-out"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          case "${{ steps.parse.outputs.type }}" in
            fetch)
              ./scripts/fetch-and-package.sh \
                work/request.json \
                "$OUT" \
                "${{ github.event.issue.number }}"
              ;;
            *)
              echo "Unsupported type: ${{ steps.parse.outputs.type }}" >&2
              exit 1
              ;;
          esac
          ARTIFACT_NAME=$(cat "$OUT/artifact-name.txt")
          ARCHIVE_SHA=$(python3 -c 'import json; print(json.load(open("'"$OUT"'/manifest.json"))["sha256"])')
          OUTPUT_NAME=$(python3 -c 'import json; print(json.load(open("'"$OUT"'/manifest.json"))["output"])')
          echo "out_dir=$OUT" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "archive_sha=$ARCHIVE_SHA" >> "$GITHUB_OUTPUT"
          echo "output_name=$OUTPUT_NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Verify packaged artifact
        run: |
          set -euo pipefail
          ./scripts/verify-transfer.sh "${{ steps.pack.outputs.out_dir }}"

      - name: Upload transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.artifact_name }}
          path: ${{ steps.pack.outputs.out_dir }}/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Job summary
        if: success()
        run: |
          set -euo pipefail
          {
            echo "## Transfer artifact"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Issue | #${{ github.event.issue.number }} |"
            echo "| Name | \`${{ steps.parse.outputs.name }}\` |"
            echo "| Type | \`${{ steps.parse.outputs.type }}\` |"
            echo "| Artifact | \`${{ steps.pack.outputs.artifact_name }}\` |"
            echo "| Archive SHA-256 | \`${{ steps.pack.outputs.archive_sha }}\` |"
            echo "| Output file | \`${{ steps.pack.outputs.output_name }}\` |"
            echo ""
            echo "Door: Actions artifact ZIP → GitHub connector → \`/mnt/data\`."
            echo "Runner never executes the payload."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment success on issue
        if: success()
        uses: actions/github-script@v7
        env:
          ARTIFACT_NAME: ${{ steps.pack.outputs.artifact_name }}
          ARCHIVE_SHA: ${{ steps.pack.outputs.archive_sha }}
          OUTPUT_NAME: ${{ steps.pack.outputs.output_name }}
          REQ_NAME: ${{ steps.parse.outputs.name }}
          REQ_TYPE: ${{ steps.parse.outputs.type }}
          REQ_SHA: ${{ steps.parse.outputs.request_sha }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## ✅ Transfer artifact ready',
              '',
              `| Field | Value |`,
              `| --- | --- |`,
              `| Workflow run | ${runUrl} |`,
              `| Artifact name | \`${process.env.ARTIFACT_NAME}\` |`,
              `| Request name | \`${process.env.REQ_NAME}\` |`,
              `| Type | \`${process.env.REQ_TYPE}\` |`,
              `| Request SHA-256 | \`${process.env.REQ_SHA}\` |`,
              `| Archive SHA-256 | \`${process.env.ARCHIVE_SHA}\` |`,
              `| Output file | \`${process.env.OUTPUT_NAME}\` |`,
              '',
              'Intended for ChatGPT Linux sandbox (or any offline environment).',
              'These are **inert bytes** — the sandbox unpacks and uses them.',
              '',
              '### Usage',
              '',
              '1. Download the Actions artifact ZIP via GitHub connector/API into `/mnt/data`.',
              '2. Unzip, then extract `transfer-payload.tar.gz` (or use the raw output file).',
              '3. Verify: `sha256sum -c SHA256SUMS`',
              '4. Use the file as needed inside the sandbox.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body,
            });

            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: ['transfer-built'],
              });
            } catch (e) {
              core.warning(`Could not add transfer-built label: ${e}`);
            }

      - name: Comment failure on issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## ❌ Transfer build failed',
              '',
              `Workflow run: ${runUrl}`,
              '',
              'Common causes:',
              '- Invalid or missing JSON request block',
              '- sha256 mismatch (URL content changed or wrong digest)',
              '- size over max_bytes',
              '- non-HTTPS URL or validation failure',
              '',
              'Fix the request and re-apply `approved-transfer`.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body,
            });
